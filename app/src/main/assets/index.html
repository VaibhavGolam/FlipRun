}
window.addEventListener('resize', resize);

/* ======================================================== seeded random */
let seed = 1;
function rnd() {
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr_ = (a, b) => a + rnd() * (b - a);
let seedE = 1;                                          // separate stream for events so layouts stay comparable
function rndE() {
  seedE |= 0; seedE = (seedE + 0x6D2B79F5) | 0;
  let t = Math.imul(seedE ^ (seedE >>> 15), 1 | seedE);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const vr = (a, b) => a + Math.random() * (b - a);       // visual-only randomness
function hash(n) { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); }

function lerpColors(dt) {
  const z = ZONES[zoneIdx % ZONES.length], k = 1 - Math.exp(-dt * 2.4);
  KEYS.forEach(key => {
    const t = hexRGB(z[key]), c = cur[key];
    for (let i = 0; i < 3; i++) c[i] += (t[i] - c[i]) * k;

}

/* ================================================================ audio */

function initAudio() {
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
  comp.connect(ac.destination);

  musBus = ac.createGain(); musBus.gain.value = musOn ? MUS_VOL : 0; musBus.connect(comp);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function resumeAudio() { if (ac && ac.state === 'suspended') ac.resume(); }

function osc(type, f1, f2, t0, dur, vol, dest) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t0);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 20), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || sfxBus);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(type, f1, f2, q, t0, dur, vol, dest) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf;
  f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f1, t0);
  if (f2 !== f1) f.frequency.exponentialRampToValueAtTime(Math.max(f2, 20), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxBus);
  s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
}
const semi = (base, n) => base * Math.pow(2, n / 12);

/* ---- music: a small step sequencer, kick + bass + hats + arp ---- */
const BASS = [0, -1, 0, 0, -1, 0, 7, -1, 0, -1, 0, 0, -1, 5, 3, -1];
const ARP  = [12, 15, 19, 15, 12, 15, 19, 22, 12, 15, 19, 15, 24, 22, 19, 15];
const ROOTS = [0, 3, 5, 7];
let musTimer = null, nextT = 0, stepIdx = 0;

function playStep(i, t) {
  const root = 55 * Math.pow(2, ROOTS[zoneIdx % 4] / 12);
  const s = i % 16, bar = Math.floor(i / 16) % 2;
  if (s % 4 === 0) { osc('sine', 130, 42, t, 0.16, 0.9, musBus); noise('lowpass', 500, 120, 0.7, t, 0.05, 0.25, musBus); }
  if (BASS[s] >= 0) {
    const n = BASS[s] + (bar && s >= 8 ? (s % 2 ? 0 : 3) : 0);
    osc('sawtooth', semi(root, n), semi(root, n), t, 0.2, 0.22, musBus);
  }
  if (s % 2 === 1) noise('highpass', 7000, 7000, 0.7, t, 0.04, 0.12, musBus);
  if (zoneIdx >= 1 && (s === 4 || s === 12)) noise('bandpass', 1800, 1200, 0.9, t, 0.12, 0.28, musBus);
  const a = ARP[s] + (bar ? 5 * (s % 8 === 0 ? 1 : 0) : 0);
  osc('square', semi(root * 2, a), semi(root * 2, a), t, 0.11, 0.07 + (zoneIdx >= 2 ? 0.03 : 0), musBus);
}
function sched() {
  if (!ac) return;
  const step = 60 / (118 + (zoneIdx % 4) * 6) / 4;
  while (nextT < ac.currentTime + 0.14) {
    if (musOn) playStep(stepIdx, nextT);
    nextT += step; stepIdx = (stepIdx + 1) % 32;
  }
}
function startMusic() {
  if (!ac || musTimer) return;
  nextT = ac.currentTime + 0.06; stepIdx = 0;
  musTimer = setInterval(sched, 25);
}
function stopMusic() { if (musTimer) { clearInterval(musTimer); musTimer = null; } }

/* ===================================================== wallet and store data */
const jget = (k, d) => { try { const v = store.get(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };

  { id: 'kitty', name: 'KITTY',  price: 1500, desc: 'Orange cat with ears, whiskers and a tail.' }
];

if (!Array.isArray(own)) own = [];
['skin:bot', 'trail:sq'].forEach(k => { if (own.indexOf(k) < 0) own.push(k); });

up.mag = Math.max(0, Math.min(3, up.mag | 0)); up.x2 = up.x2 ? 1 : 0; up.shield = Math.max(0, Math.min(SHIELD_MAX, up.shield | 0));

/* ---- progression: level, daily goals, login streak, daily challenge ---- */
const todayNum = () => {
  if (window.__forceDay != null) return window.__forceDay;
  const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
};
let bestDist = parseInt(store.get('flip_bd') || '0', 10) || 0;
let xp = parseInt(store.get('flip_xp') || '0', 10) || 0;
let streak = jget('flip_streak', { last: -1, n: 0 });
let missions = jget('flip_m', null);
let daily = jget('flip_d', { day: -1, score: 0, tries: 0 });
let mode = 'normal', dailyScored = false, dailyReward = 0, passedBest = false, xpPaid = 0, xpInfo = null, closeRun = 0;
let shareNoteT = 0, rewardAt = 0;
const STREAK_R = [20, 30, 50, 70, 100, 130, 250];
const MVALS = { coins: [20, 35, 50], score: [150, 300, 500], close: [3, 6, 10], magnet: [1, 2, 3], flips: [50, 100, 160], runs: [3, 5, 8], total: [50, 90, 140] };
const MTEXT = {
  coins: t => 'Collect ' + t + ' coins in one run', score: t => 'Score ' + t + ' in one run', close: t => 'Make ' + t + ' close calls',
  magnet: t => 'Grab ' + t + ' magnet' + (t > 1 ? 's' : ''), flips: t => 'Flip gravity ' + t + ' times', runs: t => 'Play ' + t + ' runs', total: t => 'Collect ' + t + ' coins today'
};
const MREW = [25, 40, 60], MBONUS = 75;
function genMissions(day) {
  const pool = Object.keys(MVALS).map((k, i) => ({ k, r: hash(day * 3.17 + i * 1.91) })).sort((a, b) => a.r - b.r).slice(0, 3);
  return { day, bonus: false, goals: pool.map((o, i) => ({ k: o.k, t: MVALS[o.k][i], p: 0, done: false, r: MREW[i] })) };
}
function saveMissions() { store.set('flip_m', JSON.stringify(missions)); }
function ensureMissions() {
  const d = todayNum();
  if (!missions || missions.day !== d || !Array.isArray(missions.goals)) { missions = genMissions(d); saveMissions(); }
}
ensureMissions();
function missionDone(g) {
  g.done = true; wallet += g.r; toast('GOAL DONE', '+' + g.r + ' COINS'); sfx.goal();
  if (!missions.bonus && missions.goals.every(x => x.done)) { missions.bonus = true; wallet += MBONUS; toast('ALL GOALS DONE', '+' + MBONUS + ' BONUS'); }
  saveWallet(); saveMissions();
}
function missionAdd(k, v) { for (const g of missions.goals) if (g.k === k && !g.done) { g.p += v; if (g.p >= g.t) missionDone(g); } }
function missionMax(k, v) { for (const g of missions.goals) if (g.k === k && !g.done && v > g.p) { g.p = v; if (g.p >= g.t) missionDone(g); } }
const xpFor = lv => 120 + 60 * (lv - 1);
function levelInfo(x) { let lv = 1; while (x >= xpFor(lv)) { x -= xpFor(lv); lv++; } return { lv, cur: x, need: xpFor(lv) }; }
function awardXp() {
  const total = Math.floor(score / 6) + earned, gain = total - xpPaid; xpPaid = total;
  if (gain <= 0) return;
  const b = levelInfo(xp).lv; xp += gain; const a = levelInfo(xp).lv;
  let rc = 0, sh = 0;
  for (let l = b + 1; l <= a; l++) { rc += l * 25; if (l % 5 === 0 && up.shield < SHIELD_MAX) { up.shield++; sh++; } }
  wallet += rc;
  xpInfo = { gain: gain + (xpInfo ? xpInfo.gain : 0), b: xpInfo ? xpInfo.b : b, a, rc: rc + (xpInfo ? xpInfo.rc : 0), sh: sh + (xpInfo ? xpInfo.sh : 0) };
  store.set('flip_xp', String(xp)); saveAll();
  if (a > b) setTimeout(() => sfx.levelup(), 700);
}
function streakNext() { const t = todayNum(); return streak.last === t ? null : (streak.last === t - 1 ? streak.n + 1 : 1); }
function streakCur() { const nx = streakNext(); return nx == null ? (streak.n - 1) % 7 : (nx - 1) % 7; }
function claimStreak() {
  const nx = streakNext(); if (nx == null) return 0;
  const d = (nx - 1) % 7, r = STREAK_R[d];
  streak = { last: todayNum(), n: nx }; wallet += r;
  if (d === 6) up.shield = Math.min(SHIELD_MAX, up.shield + 2);
  store.set('flip_streak', JSON.stringify(streak)); saveAll();
  return r;
}
const dailySeed = () => ((Math.imul(todayNum(), 2654435761) ^ 0xA5A5A5A5) | 0) || 12345;

/* ============================================================ game state */
const START = 300, GA = 5200, V0 = 210, VMAX = 1250, R = 19, TF = 0.30;
let state = 'menu';                     // menu | play | paused | dead
let clock = 0, playTime = 0, dist = 0, speed = START;
let score = 0, bonus = 0, coinsGot = 0, lastMile = 0;
let best = parseInt(store.get('flip_best') || '0', 10) || 0;
let newBest = false, deadAt = 0, shake = 0, flash = 0, hudPulse = 0, distToNext = 0;
let zoneIdx = 0, toastT = 0, toastText = '';
let combo = 0, comboT = 0, noCoins = false, auto = false, lastKiller = null, edgePulse = 0;
let earned = 0, magT = 0, magMax = 6, shieldOn = false, invuln = 0, adNoteT = 0;
let sz = 1, szT = 1, sizeLeft = 0, sizeNext = 12, sizeKind = '';
let surgeLeft = 0, surgeAt = 20, cam = 0, camDir = 1, pendingPick = null, pickDist = 4500;
const BIGS = 1.4, SMALLS = 0.68, SIZE_DUR = 7, SURGE_DUR = 5.2, SURGE_BOOST = 0.12;
let toastSub = 'ZONE 1';
let stTab = 0, stSel = 0, stFrom = 'menu', denyT = 0, buyT = 0;

const obs = [], coins = [], parts = [], trail = [], pops = [];
const P = { x: 96, y: 0, vy: 0, g: 1, grounded: true, coyote: 0, buf: 0, rot: 0, rotT: 0, sq: 0, falling: false };
const surfY = g => (g > 0 ? CB - R * sz : CT + R * sz);

const stars = [];
for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * 500, y: Math.random(), z: 0.2 + Math.random() * 0.8, tw: Math.random() * TAU, s: Math.random() < 0.2 ? 2 : 1 });
const lines = [];
for (let i = 0; i < 9; i++) lines.push({ x: Math.random() * 500, y: Math.random(), s: 1.8 + Math.random() * 2.2, l: 0.6 + Math.random() * 0.8 });

function setZone(z, instant) {
  zoneIdx = z;
  if (instant) snapColors();
}
function resetGame() {
  obs.length = 0; coins.length = 0; parts.length = 0; trail.length = 0;
  if (mode === 'daily') seed = dailySeed();
  else if (!window.__forceSeed) seed = (Date.now() ^ (Math.random() * 1e9)) | 0; else seed = window.__forceSeed;
  seedE = (seed ^ 0x5bd1e995) | 0;
  pops.length = 0; passedBest = false; xpPaid = 0; xpInfo = null; closeRun = 0; dailyReward = 0;
  playTime = 0; dist = 0; speed = START; score = 0; bonus = 0; coinsGot = 0; lastMile = 0;
  newBest = false; shake = 0; flash = 0; hudPulse = 0; toastT = 0; combo = 0; comboT = 0; lastKiller = null;
  distToNext = 60;
  earned = 0; magT = 0; shieldOn = false; invuln = 0; sz = 1; szT = 1; sizeLeft = 0; sizeKind = '';
  sizeNext = 11 + rndE() * 5; surgeLeft = 0; surgeAt = 18 + rndE() * 6; cam = 0; camDir = 1;
  pendingPick = null; pickDist = 4200 + rndE() * 2500;
  setZone(0, true);
  P.g = 1; P.grounded = true; P.coyote = 0; P.buf = 0; P.vy = 0; P.rot = 0; P.rotT = 0; P.sq = 0; P.falling = false;
  P.y = surfY(1);
}
resetGame();

/* ============================================================== patterns */
const other = s => (s === 'f' ? 'c' : 'f');
function addSpikes(side, x, n) { for (let i = 0; i < n; i++) obs.push({ type: 'spike', side, x: x + i * 34, w: 34, h: 34 }); return n * 34; }
function addBlock(side, x, w, h) { obs.push({ type: 'block', side, x, w, h }); return w; }
function addGap(side, x, w) { obs.push({ type: 'gap', side, x, w, h: 0 }); return w; }
function coinsOn(side, x, n) {
  if (noCoins) return;
  const y = side === 'f' ? CB - 30 : CT + 30;
  for (let i = 0; i < n; i++) coins.push({ x: x + i * 30, y, ph: Math.random() * TAU });
}
const PATS = [
  { id: 'row', min: 0, w: 5 }, { id: 'block', min: 0, w: 4 }, { id: 'arc', min: 3, w: 1.3 },
  { id: 'alt', min: 5, w: 4 }, { id: 'gap', min: 8, w: 3 }, { id: 'bgap', min: 14, w: 3 },
  { id: 'gate', min: 26, w: 2 }, { id: 'rhythm', min: 38, w: 2.2 },
  { id: 'drop', min: 28, w: 2.4 }, { id: 'saw', min: 35, w: 2.4 }
];
const isRush = () => zoneIdx % 5 === 4;       // every fifth zone is a rush zone: denser patterns, double coins
const pw = p => p.w * (isRush() && (p.id === 'rhythm' || p.id === 'alt' || p.id === 'saw' || p.id === 'drop') ? 1.8 : 1);
// During a speed surge the world moves faster, so patterns spawned around it get extra room to keep them fair.
function spacingBoost() { return (surgeLeft > 0 || (playTime > surgeAt - 1.5 && playTime < surgeAt + 0.2)) ? 1 + SURGE_BOOST : 1; }
function spawnPattern(x) {
  const nb = coins.length;
  const d = Math.min(1, playTime / 90), sp = speed * spacingBoost();
  const D = sp * (TF + 0.2 + 0.1 * (1 - d));
  let tot = 0;
  PATS.forEach(p => { if (playTime >= p.min) tot += pw(p); });
  let r = rnd() * tot, pick = PATS[0];
  for (const p of PATS) { if (playTime < p.min) continue; if ((r -= pw(p)) <= 0) { pick = p; break; } }
  const side = rnd() < 0.5 ? 'f' : 'c';
  let L = 0;
  switch (pick.id) {
    case 'row': {
      const n = 1 + Math.floor(rnd() * (2 + d * 2));
      L = addSpikes(side, x, n);
      if (rnd() < 0.6) coinsOn(other(side), x, Math.min(3, n + 1));
      break;
    }
    case 'block': {
      const w = Math.round(rr_(38, 60)), h = Math.round(rr_(50, 70 + d * 45));
      L = addBlock(side, x, w, h);
      if (rnd() < 0.6) coinsOn(other(side), x, 2);
      break;
    }
    case 'gap': {
      const w = Math.round(sp * rr_(0.26, 0.42 + d * 0.2));
      L = addGap(side, x, w);
      if (rnd() < 0.7) coinsOn(other(side), x + 8, Math.max(1, Math.min(4, Math.floor(w / 32))));
      break;
    }
    case 'alt': {
      const n = 2 + (rnd() < 0.3 + d * 0.3 ? 1 : 0);
      let s = side, cx = x, end = x;
      for (let i = 0; i < n; i++) {
        let w;
        if (rnd() < 0.5) w = addSpikes(s, cx, 1 + (rnd() < 0.3 ? 1 : 0));
        else w = addBlock(s, cx, Math.round(rr_(38, 52)), Math.round(rr_(50, 80)));
        end = cx + w; cx = end + D; s = other(s);
      }
      L = end - x;
      break;
    }
    case 'bgap': {
      const w = Math.round(sp * rr_(0.3, 0.5));
      addGap(side, x, w);
      const sw = addSpikes(other(side), x + w + D, 1 + (rnd() < 0.4 ? 1 : 0));
      L = w + D + sw;
      break;
    }
    case 'gate': {
      obs.push({ type: 'spike', side: 'f', x, w: 34, h: 34, gate: true });
      obs.push({ type: 'spike', side: 'c', x, w: 34, h: 34, gate: true });
      L = 34;
      break;
    }
    case 'rhythm': {
      const n = 3 + (rnd() < 0.5 ? 1 : 0), Dr = sp * (TF + 0.13);
      let s = side, cx = x, end = x;
      for (let i = 0; i < n; i++) { const w = addSpikes(s, cx, 1); end = cx + w; cx = end + Dr; s = other(s); }
      L = end - x;
      break;
    }
    case 'saw': {
      obs.push({ type: 'saw', side, x, w: 30, h: 0, hF: 150, reach: 110, ph: rnd() * TAU });
      L = 30;
      if (rnd() < 0.6) coinsOn(other(side), x, 2);
      break;
    }
    case 'drop': {
      const hF = Math.round(rr_(78, 100 + d * 15));
      obs.push({ type: 'block', side, x, w: 44, h: 22, hF, drop: true });
      L = 44;
      if (rnd() < 0.6) coinsOn(other(side), x, 2);
      break;
    }
    case 'arc': {
      const up = rnd() < 0.5;
      if (!noCoins) {
        for (let i = 1; i <= 4; i++) {
          const tt = TF * i / 5, dd = V0 * tt + 0.5 * GA * tt * tt;
          const y0 = up ? CB - R : CT + R;
          coins.push({ x: x + sp * tt, y: up ? y0 - dd : y0 + dd, ph: Math.random() * TAU });
        }
      }
      L = sp * TF;
      break;
    }
  }
  if (pendingPick && coins.length > nb) {
    coins[nb + Math.floor((coins.length - nb) / 2)].kind = pendingPick;
    pendingPick = null;
  }
  return L;
}

/* ================================================================ player */
function doFlip() {
  P.g = -P.g; P.grounded = false; P.coyote = 0; P.buf = 0; P.falling = false;
  P.vy = P.g * V0; P.rotT += Math.PI; P.sq = 1;
  parts.push({ ring: true, x: P.x, y: P.y, r: 8, life: 0.35, max: 0.35, color: 'accent2' });
  for (let i = 0; i < 6; i++) parts.push({ x: P.x, y: P.y, vx: vr(-140, 40), vy: -P.g * vr(40, 180) + vr(-60, 60), life: vr(0.2, 0.4), max: 0.4, size: vr(2, 4), color: 'accent', grav: 0 });
  if (state === 'play') { sfx.flip(P.g > 0); missionAdd('flips', 1); }
}
function tryFlip() {
  if (P.grounded || P.coyote > 0) doFlip();
  else P.buf = 0.14;
}
function gapAt(side, x) {
  for (const o of obs) {
    if (o.type === 'gap' && o.side === side && x > o.x + 6 && x < o.x + o.w - 6) return true;
  }
  return false;
}
function stepPlayer(dt, demo) {
  const sf = surfY(P.g), side = P.g > 0 ? 'f' : 'c';
  if (P.coyote > 0) P.coyote -= dt;
  if (P.buf > 0) P.buf -= dt;

  if (P.grounded) {
    P.y = sf; P.vy = 0;
    if (gapAt(side, P.x)) { P.grounded = false; P.coyote = 0.07; P.falling = true; }
    else if (P.buf > 0) doFlip();
  } else {
    P.vy += P.g * GA * dt;
    if (P.vy > VMAX) P.vy = VMAX; else if (P.vy < -VMAX) P.vy = -VMAX;
    P.y += P.vy * dt;
    const sf2 = surfY(P.g);
    const past = P.g > 0 ? P.y - sf2 : sf2 - P.y;       // how far through the surface
    if (past >= 0) {
      if (P.falling || gapAt(side, P.x)) {
        P.falling = true;
        if (past > 36 && !demo) die('gap');
        else if (past > 36 && demo) { P.falling = false; P.grounded = true; P.y = sf2; P.vy = 0; }
      } else {
        P.y = sf2; P.vy = 0; P.grounded = true; P.sq = -0.8;
        for (let i = 0; i < 6; i++) parts.push({ x: P.x + vr(-8, 8), y: sf2 + P.g * R * sz, vx: vr(-90, 30) - speed * 0.2, vy: -P.g * vr(20, 80), life: vr(0.2, 0.4), max: 0.4, size: vr(2, 4), color: 'accent2', grav: 0 });
        edgePulse = 1;
        if (state === 'play') sfx.land();
      }
    }
  }
  P.rot += (P.rotT - P.rot) * (1 - Math.exp(-18 * dt));
  P.sq *= Math.exp(-10 * dt);
}

function sawY(o) {
  const dir = o.side === 'f' ? -1 : 1, base = o.side === 'f' ? CB : CT;
  return base + dir * (18 + (0.5 + 0.5 * Math.sin(clock * 2.4 + o.ph)) * o.reach);
}
function obsBox(o) {
  let ol, orr, ot, ob;
  if (o.type === 'spike') {
    ol = o.x + 8; orr = o.x + o.w - 8;
    if (o.side === 'f') { ot = CB - o.h + 12; ob = CB; } else { ot = CT; ob = CT + o.h - 12; }
  } else {
    ol = o.x + 3; orr = o.x + o.w - 3;
    if (o.side === 'f') { ot = CB - o.h + 2; ob = CB; } else { ot = CT; ob = CT + o.h - 2; }
  }
  return [ol, orr, ot, ob];
}
function hit() {
  const hw = 11 * sz, hh = 12 * sz, l = P.x - hw, r = P.x + hw, t = P.y - hh, b = P.y + hh;
  for (const o of obs) {
    if (o.type === 'gap' || o.x > r + 4 || o.x + o.w < l - 4) continue;
    if (o.type === 'saw') {
      const cx = o.x + o.w / 2, cy = sawY(o), nx = Math.max(l, Math.min(cx, r)), ny = Math.max(t, Math.min(cy, b));
      if ((cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < 12 * 12) return o;
      continue;
    }
    const q = obsBox(o);
    if (r > q[0] && l < q[1] && b > q[2] && t < q[3]) return o;
  }
  return null;
}
// Close call: you cleared a spike or block by a few pixels.
function closeCheck() {
  const hw = 11 * sz, hh = 12 * sz, tl = P.x - hw, tr = P.x + hw, tt = P.y - hh, tb = P.y + hh;
  for (const o of obs) {
    if (o.type === 'gap' || o.type === 'saw' || o.paid) continue;
    if (o.x > tr + 60 || o.x + o.w < tl - 60) continue;
    const q = obsBox(o);
    if (tr > q[0] && tl < q[1]) { const gp = o.side === 'f' ? q[2] - tb : tt - q[3]; if (gp > 0 && gp < 28) o.close = true; }
    else if (o.close && tl >= q[1]) { o.paid = true; closeCall(); }
  }
}
function closeCall() {
  bonus += 10; closeRun++; hudPulse = 0.6; missionAdd('close', 1); sfx.close();
  pops.push({ x: P.x + 10, y: P.y + (P.g > 0 ? -38 : 38), vy: -P.g * 30, life: 0.9, max: 0.9, text: 'CLOSE! +10', color: '#FFD65A' });
}

/* ===================================================================== bot */
// Used for the menu attract mode and for automated testing.
const clearT = h => (-V0 + Math.sqrt(V0 * V0 + 2 * GA * Math.max(0, h - 7))) / GA;
function botThink() {
  if (!(P.grounded || P.coyote > 0)) return;
  const onFloor = P.g > 0;
  let o = null;
  for (const q of obs) {
    if (q.x + q.w < P.x - 14) continue;
    if (q.gate || (onFloor ? q.side === 'f' : q.side === 'c')) { o = q; break; }
  }
  if (!o) return;
  const sp = speed;
  if (o.gate) {
    const half = (CH - 2 * R * sz) / 2;
    const tm = (-V0 + Math.sqrt(V0 * V0 + 2 * GA * half)) / GA;
    if (o.x + o.w / 2 - P.x <= sp * tm) tryFlip();
  } else if (o.type === 'gap') {
    if (o.x + 6 - P.x <= sp * 0.02) tryFlip();
  } else if (o.type === 'block' || o.type === 'saw') {
    if (o.x - (P.x + 11 * sz) <= sp * (clearT(o.hF || o.h) + 0.035)) tryFlip();
  } else if (o.x - (P.x + 11 * sz) <= sp * 0.09) tryFlip();
}

/* ================================================================== update */
function toast(sub, text) { toastSub = sub; toastText = text; toastT = 2.0; }
function clearNear(a, b) {
  for (let i = obs.length - 1; i >= 0; i--) { const o = obs[i]; if (o.x + o.w > P.x - a && o.x < P.x + b) obs.splice(i, 1); }
}
function rescue() { P.falling = false; P.grounded = true; P.vy = 0; P.coyote = 0; P.y = surfY(P.g); }

function die(why) {
  if (state !== 'play') return;
  if (invuln > 0 || shieldOn) {                       // shield or revive grace: absorb the hit
    if (invuln <= 0) {
      shieldOn = false; invuln = 1.5; shake = 9; flash = 0.45; sfx.shieldBreak();
      parts.push({ ring: true, x: P.x, y: P.y, r: 14, life: 0.5, max: 0.5, color: 'accent2' });
      for (let i = 0; i < 18; i++) { const a = vr(0, TAU), v = vr(100, 300); parts.push({ x: P.x, y: P.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: vr(0.3, 0.7), max: 0.7, size: vr(2, 5), color: 'accent2', grav: 0 }); }
    }
    clearNear(70, 120);
    if (why === 'gap') rescue();
    return;
  }
  state = 'dead'; deadAt = performance.now(); lastKiller = why;
  if (score > best) { best = score; newBest = true; store.set('flip_best', String(best)); }
  if (dist > bestDist) { bestDist = dist; store.set('flip_bd', String(Math.floor(bestDist))); }
  missionMax('score', score);
  if (mode === 'daily' && dailyScored) {
    daily.score = Math.max(daily.score, score); store.set('flip_d', JSON.stringify(daily));
    if (!dailyReward) { dailyReward = 50; wallet += 50; }
  }
  awardXp(); saveWallet(); saveMissions();
  shake = 16; flash = 1;
  for (let i = 0; i < 40; i++) {
    const a = vr(0, TAU), v = vr(80, 420);
    parts.push({ x: P.x, y: P.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: vr(0.5, 1.1), max: 1.1, size: vr(3, 8), color: ['accent', 'accent2', 'danger'][i % 3], grav: 500 });
  }
  parts.push({ ring: true, x: P.x, y: P.y, r: 10, life: 0.5, max: 0.5, color: 'danger' });
  stopMusic(); sfx.die();
  try { if (navigator.vibrate) navigator.vibrate(45); } catch (e) {}
}

// Continue the run after a crash. Nothing calls this yet: it is the hook for the rewarded-ad revive.
function revive() {
  if (state !== 'dead') return;
  state = 'play'; invuln = 2; lastKiller = null; newBest = false; shake = 0; flash = 0.4;
  clearNear(80, 520); rescue(); parts.length = 0;
  sfx.revive(); startMusic();
}
// Ads are not connected. When an ad SDK is added, show a rewarded ad in showRewarded() and call onReward() when it finishes.
const Ads = { connected: false, showRewarded(onReward) { return false; } };
function watchAd() {
  if (!Ads.connected || !Ads.showRewarded(revive)) { adNoteT = 2.4; sfx.deny(); }
}
function goHome() { mode = 'normal'; resetGame(); state = 'menu'; sfx.tick(); }

function runEvents(dt) {
  // big / small size events
  if (sizeLeft > 0) {
    sizeLeft -= dt;
    if (sizeLeft <= 0) { szT = 1; sizeKind = ''; sfx.tick(); }
  } else if (playTime >= sizeNext) {
    sizeKind = rndE() < 0.5 ? 'big' : 'small';
    szT = sizeKind === 'big' ? BIGS : SMALLS; sizeLeft = SIZE_DUR;
    sizeNext = playTime + SIZE_DUR + 14 + rndE() * 10;
    if (sizeKind === 'big') { toast('SIZE UP', 'BIG MODE'); sfx.grow(); } else { toast('SIZE DOWN', 'MINI MODE'); sfx.shrink(); }
    parts.push({ ring: true, x: P.x, y: P.y, r: 10, life: 0.45, max: 0.45, color: 'accent' });
  }
  // speed surge with a tilted, zoomed camera that settles back after about five seconds
  if (surgeLeft > 0) surgeLeft -= dt;
  else if (playTime >= surgeAt) {
    surgeLeft = SURGE_DUR; camDir = -camDir;
    surgeAt = playTime + SURGE_DUR + 20 + rndE() * 12;
    toast('SPEED UP', 'HOLD ON!'); sfx.surge();
  }
  const tgt = surgeLeft > 0 ? Math.max(0, Math.min(1, (SURGE_DUR - surgeLeft) / 0.7, surgeLeft / 1.0)) : 0;
  cam += (tgt - cam) * (1 - Math.exp(-dt * 7));
}

function worldStep(dt, demo) {
  if (demo) speed = 330;
  else speed = (START + Math.min(260, playTime * 3.2)) * (1 + SURGE_BOOST * cam);
  const dx = speed * dt;
  dist += dx;
  for (const o of obs) o.x -= dx;
  for (const c of coins) c.x -= dx;
  for (const t of trail) t.x -= dx;
  for (const q of pops) q.x -= dx;
  for (const o of obs) if (o.drop) {              // falling blocks: drop shortly before you arrive
    if (!o.fall && o.x - P.x < speed * 0.8) { o.fall = true; if (!demo) sfx.thud(); }
    if (o.fall) o.h += (o.hF - o.h) * (1 - Math.exp(-dt * 16));
  }
  while (obs.length && obs[0].x + obs[0].w < vx0() - 90) obs.shift();
  for (let i = coins.length - 1; i >= 0; i--) if (coins[i].x < vx0() - 60) coins.splice(i, 1);

  distToNext -= dx;
  if (distToNext <= 0) {
    noCoins = demo;
    const d = Math.min(1, playTime / 90);
    const L = spawnPattern(Math.max(W, vx1()) + 70 - distToNext);
    const lead = (speed * (TF + 0.22 + (1 - d) * 0.3) + rnd() * speed * 0.3 * (1 - d * 0.5)) * (isRush() ? 0.88 : 1);
    distToNext = L + lead;
  }
  if (!demo) {
    pickDist -= dx;
    if (pickDist <= 0 && !pendingPick) { pendingPick = 'magnet'; pickDist = 6500 + rndE() * 3500; }
  }

  sz += (szT - sz) * (1 - Math.exp(-dt * 9));
  if (demo || auto) botThink();
  stepPlayer(dt, demo);

  trail.push({ x: P.x, y: P.y, rot: P.rot });
  if (trail.length > 14) trail.shift();

  if (!demo && state === 'play') {
    if (invuln > 0) invuln -= dt;
    const k = hit();
    if (k) { die(k.type); if (state !== 'play') return; }
    closeCheck();
    if (!passedBest && bestDist > 400 && dist > bestDist) {
      passedBest = true; hudPulse = 1; sfx.mile();
      pops.push({ x: P.x + 10, y: P.y + (P.g > 0 ? -38 : 38), vy: -P.g * 30, life: 1.4, max: 1.4, text: 'BEST PASSED!', color: '#7DFF8A' });
    }
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    if (magT > 0) {                                   // magnet: pull every coin on screen toward the player
      magT -= dt;
      const pk = 1 - Math.exp(-dt * 9);
      for (const c of coins) {
        if (c.kind || c.x > vx1() + 30) continue;
        c.x += (P.x - c.x) * pk; c.y += (P.y - c.y) * pk; c.pulled = true;
      }
    }
    const pr = 24 * Math.max(1, sz);
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i], ddx = c.x - P.x, ddy = c.y - P.y;
      if (ddx * ddx + ddy * ddy < pr * pr) {
        coins.splice(i, 1);
        if (c.kind === 'magnet') {
          magMax = MAGDUR[up.mag]; magT = magMax; sfx.magnet(); toast('POWER-UP', 'MAGNET'); missionAdd('magnet', 1);
          parts.push({ ring: true, x: P.x, y: P.y, r: 10, life: 0.5, max: 0.5, color: 'danger' });
          for (let j = 0; j < 12; j++) parts.push({ x: c.x, y: c.y, vx: vr(-160, 160), vy: vr(-160, 160), life: vr(0.3, 0.6), max: 0.6, size: vr(2, 5), color: 'danger', grav: 0 });
          continue;
        }
        bonus += szT > 1 ? 10 : 5; coinsGot++; hudPulse = 0.6; combo++; comboT = 1.1;
        const val = (up.x2 ? 2 : 1) * (isRush() ? 2 : 1); wallet += val; earned += val;
        missionAdd('total', 1); missionMax('coins', coinsGot);
        sfx.coin(combo - 1);
        for (let j = 0; j < 8; j++) parts.push({ x: c.x, y: c.y, vx: vr(-120, 120), vy: vr(-120, 120), life: vr(0.25, 0.5), max: 0.5, size: vr(2, 4), color: 'gold', grav: 0 });
      }
    }
    if (Math.random() < dt * 10 && P.grounded) parts.push({ x: P.x - 8, y: surfY(P.g) + P.g * R * sz, vx: -speed * 0.35, vy: -P.g * vr(10, 40), life: 0.3, max: 0.3, size: vr(1.5, 3), color: 'accent2', grav: 0 });

}

function update(dt) {
  clock += dt;
  if (state === 'menu' || state === 'goals' || state === 'reward' || (state === 'store' && stFrom === 'menu')) worldStep(dt, true);
  else if (state === 'play') {
    playTime += dt;
    runEvents(dt);
    worldStep(dt, false);
    if (state === 'play') {
      score = Math.floor(dist / 28) + bonus; missionMax('score', score);
      if (score - lastMile >= 100) { lastMile = Math.floor(score / 100) * 100; hudPulse = 1; sfx.mile(); }
      const z = Math.floor(score / 250);
      if (z !== zoneIdx) {
        setZone(z);
        toast(isRush() ? 'RUSH ZONE  COINS x2' : 'ZONE ' + (z + 1), ZONES[z % ZONES.length].name);
        flash = 0.5; sfx.zone();
      }
    }
  } else {
    P.sq *= Math.exp(-10 * dt);
  }
  if (state !== 'play' && state !== 'paused') cam *= Math.exp(-dt * 3);
  shareNoteT = Math.max(0, shareNoteT - dt); adNoteT = Math.max(0, adNoteT - dt); denyT = Math.max(0, denyT - dt); buyT = Math.max(0, buyT - dt);
  lerpColors(dt);

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.ring) { p.r += 260 * dt; continue; }
    p.vy += (p.grav || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = pops.length - 1; i >= 0; i--) { const q = pops[i]; q.life -= dt; if (q.life <= 0) pops.splice(i, 1); else q.y += q.vy * dt; }
  shake *= Math.exp(-9 * dt);
  flash = Math.max(0, flash - dt * 3);
  hudPulse = Math.max(0, hudPulse - dt * 3);
  toastT = Math.max(0, toastT - dt);
  edgePulse = Math.max(0, edgePulse - dt * 4);
}

function edgeSegments(y, side) {
  const gs = obs.filter(o => o.type === 'gap' && o.side === side && o.x + o.w > vx0() - 10 && o.x < vx1() + 10).sort((a, b) => a.x - b.x);
  ctx.beginPath();
  let cx = vx0() - 48;
  for (const g of gs) { if (g.x > cx) { ctx.moveTo(cx, y); ctx.lineTo(g.x, y); } cx = Math.max(cx, g.x + g.w); }
  ctx.moveTo(cx, y); ctx.lineTo(vx1() + 48, y);

}
function slabGrid() {

  ctx.save();

  ctx.strokeStyle = rgba('accent', 0.10);

  for (let x = x0 - step * 6 - off; x < x1 + step * 6; x += step) {

    ctx.moveTo(ix, CB); ctx.lineTo(bx, H);

  // ceiling: mirrored

  for (let i = 1; i < 12; i++) { const y = CT - i * i * 2.6 - 4; if (y < 0) break; ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  for (let x = x0 - step * 6 - off; x < x1 + step * 6; x += step) {
    const bx = x, ix = cx + (bx - cx) * (vpc - CT) / (vpc - 0);
    ctx.moveTo(ix, CT); ctx.lineTo(bx, 0);

function drawSlabs() {

    const fl = o.side === 'f', y0 = fl ? CB : -2, hh = fl ? H - CB + 4 : CT + 2;

    if (fl) { ag.addColorStop(0, 'rgba(0,0,0,0.96)'); ag.addColorStop(0.35, 'rgba(0,0,0,0.8)'); ag.addColorStop(1, 'rgba(0,0,0,0.5)'); }
    else { ag.addColorStop(0, 'rgba(0,0,0,0.5)'); ag.addColorStop(0.65, 'rgba(0,0,0,0.8)'); ag.addColorStop(1, 'rgba(0,0,0,0.96)'); }
    ctx.fillStyle = ag; ctx.fillRect(o.x, y0, o.w, hh);

function drawBotTo(g, size, body, eyes, dark, t, look) {

function copyText(t) {

    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:-999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  } catch (e) { return false; }
}
async function shareScore() {
  const text = 'I scored ' + score + ' in FLIP//RUN! Can you beat it? By Vaibhav Golam';
  try {

    const blob = await new Promise(r => cvs.toBlob(r, 'image/png'));
    const file = new File([blob], 'fliprun-score.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }

const STAB = ['SKINS', 'TRAILS', 'BOOSTS', 'IN-APP'];
function itemsFor(tab) {
  if (tab === 0) return SKINS.map(s => ({ kind: 'skin', id: s.id, name: s.name, price: s.price, desc: s.desc }));
  if (tab === 1) return TRAILS.map(s => ({ kind: 'trail', id: s.id, name: s.name, price: s.price, desc: s.desc }));
  if (tab === 2) return [
    { kind: 'mag', id: 'mag', name: 'MAGNET TIME', desc: 'Magnets last longer. Up to 3 upgrades.' },
    { kind: 'x2', id: 'x2', name: 'COIN x2', desc: 'Coins count double in your wallet.' },
    { kind: 'shield', id: 'shield', name: 'SHIELD', desc: 'Survives one crash. One is used each run.' }
  ];
  return [
    { kind: 'iap', id: 'coins', name: 'COIN PACKS', desc: 'Buy coins with real money. This is coming in a later update.' },
    { kind: 'iap', id: 'noads', name: 'REMOVE ADS', desc: 'No more ad prompts after a crash. Coming in a later update.' },
    { kind: 'iap', id: 'bundle', name: 'STARTER BUNDLE', desc: 'A skin and a pile of coins in one pack. Coming in a later update.' }
  ];
}
function itemState(it) {
  switch (it.kind) {
    case 'skin': { const o = own.indexOf('skin:' + it.id) >= 0; return { st: eqSkin === it.id ? 'equipped' : o ? 'owned' : 'buy', price: it.price }; }
    case 'trail': { const o = own.indexOf('trail:' + it.id) >= 0; return { st: eqTrail === it.id ? 'equipped' : o ? 'owned' : 'buy', price: it.price }; }
    case 'mag': return up.mag >= 3 ? { st: 'max', price: 0 } : { st: 'buy', price: MAGPRICE[up.mag] };
    case 'x2': return up.x2 ? { st: 'max', price: 0 } : { st: 'buy', price: X2_PRICE };
    case 'shield': return up.shield >= SHIELD_MAX ? { st: 'max', price: 0 } : { st: 'buy', price: SHIELD_PRICE };
    default: return { st: 'soon', price: 0 };
  }
}
function subText(it) {
  if (it.kind === 'mag') return MAGDUR[up.mag] + 's now' + (up.mag < 3 ? ', ' + MAGDUR[up.mag + 1] + 's next' : ', maxed');
  if (it.kind === 'x2') return up.x2 ? 'Active' : 'Not bought';
  if (it.kind === 'shield') return 'In stock: ' + up.shield + ' of ' + SHIELD_MAX;
  return '';
}
function doAction(it) {
  const s = itemState(it);
  if (s.st === 'soon' || s.st === 'max') { sfx.deny(); return; }
  if (s.st === 'equipped') { sfx.tick(); return; }
  if (s.st === 'owned') {
    if (it.kind === 'skin') eqSkin = it.id; else eqTrail = it.id;
    saveAll(); sfx.equip(); return;
  }
  if (wallet < s.price) { denyT = 0.45; sfx.deny(); return; }
  wallet -= s.price;
  if (it.kind === 'skin') { own.push('skin:' + it.id); eqSkin = it.id; }
  else if (it.kind === 'trail') { own.push('trail:' + it.id); eqTrail = it.id; }
  else if (it.kind === 'mag') up.mag++;
  else if (it.kind === 'x2') up.x2 = 1;
  else if (it.kind === 'shield') up.shield++;
  buyT = 0.6; saveAll(); sfx.buy();
}
function defaultSel(tab) {
  if (tab === 0) return Math.max(0, SKINS.findIndex(s => s.id === eqSkin));
  if (tab === 1) return Math.max(0, TRAILS.findIndex(s => s.id === eqTrail));
  return 0;
}

}
function drawDetail(it) {

  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5; rrect(d.x, d.y, d.w, d.h, 18); ctx.stroke();
  if (!it) return;

  if (sub) txt(sub, d.x + 16, d.y + 48, F(12, 800), C.accent, 'left');

  lines.forEach((l, i) => txt(l, d.x + 16, d.y + (sub ? 66 : 52) + i * 15, F(12, 600), 'rgba(255,255,255,0.74)', 'left'));

  ctx.fillStyle = live ? '#FFFFFF' : 'rgba(255,255,255,0.14)';
  rrect(-62, -24, 124, 48, 24); ctx.fill();
  if (s.st === 'buy' && afford) {
    txt('BUY', -46, 6, F(16, 900), C.slab, 'left'); coinIcon(10, 0, 7); txt(String(s.price), 21, 6, F(16, 900), C.slab, 'left');
  } else if (s.st === 'buy') txt('NEED ' + (s.price - wallet), 0, 5, F(14, 900), 'rgba(255,255,255,0.6)');
  else if (s.st === 'owned') txt('EQUIP', 0, 6, F(17, 900), C.slab);
  else if (s.st === 'equipped') txt('EQUIPPED', 0, 5, F(14, 900), '#7DFF8A');
  else if (s.st === 'max') txt('MAXED', 0, 5, F(15, 900), '#7DFF8A');

}
function drawStore() {
  ctx.fillStyle = 'rgba(6,8,30,0.95)'; ctx.fillRect(vx0() - 44, -44, vx1() - vx0() + 88, H + 88);
  ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.arc(34, 46, 19, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(38, 37); ctx.lineTo(29, 46); ctx.lineTo(38, 55); ctx.stroke();
  glowOn(C.accent, 14); txt('STORE', W / 2, 58, F(30, 900, true), '#FFFFFF'); glowOff();
  const ws = String(wallet); ctx.font = F(17, 800);
  const ww = ctx.measureText(ws).width + 48;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; rrect(W - 14 - ww, 28, ww, 36, 18); ctx.fill();
  coinIcon(W - 14 - ww + 19, 46, 9);
  txt(ws, W - 14 - 14, 52, F(17, 800), '#FFFFFF', 'right');
  const tw = (W - 28) / 4;
  for (let i = 0; i < 4; i++) {
    const x = 14 + i * tw, on = i === stTab;
    ctx.fillStyle = on ? '#FFFFFF' : 'rgba(255,255,255,0.12)'; rrect(x + 2, 84, tw - 4, 32, 16); ctx.fill();
    txt(STAB[i], x + tw / 2, 105, F(12, 900), on ? '#10143A' : 'rgba(255,255,255,0.82)');
  }
  const rects = gridRects();
  rects.forEach((r, i) => drawCard(r, i === stSel));
  drawDetail(rects[stSel] && rects[stSel].it);
}
function storePress(p) {
  if (!p) return;
  if (Math.hypot(p.x - 34, p.y - 46) < 26) { sfx.tick(); state = stFrom; return; }
  if (p.y > 80 && p.y < 120) {
    const i = Math.floor((p.x - 14) / ((W - 28) / 4));
    if (i >= 0 && i < 4 && i !== stTab) { stTab = i; stSel = defaultSel(i); sfx.tick(); }
    return;
  }
  if (inR(p, actBtn())) { const r = gridRects()[stSel]; if (r) doAction(r.it); return; }
  const rs = gridRects();
  for (let i = 0; i < rs.length; i++) if (inBox(p, rs[i])) { if (stSel !== i) sfx.tick(); stSel = i; return; }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.top; ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = shake > 0.3 ? shake : 0, shx = sh ? vr(-sh, sh) * scale : 0, shy = sh ? vr(-sh, sh) * scale : 0;
  ctx.setTransform(scale, 0, 0, scale, offX + shx, shy);

  ctx.save();                                       // world, with the surge camera: tilt and zoom
  if (cam > 0.003) {
    ctx.translate(W / 2, H / 2);
    ctx.rotate(camDir * 0.08 * cam + Math.sin(clock * 2.4) * 0.012 * cam);
    const z = 1 + 0.14 * cam; ctx.scale(z, z);
    ctx.translate(-W / 2, -H / 2);
  }
  drawBackground();
  drawSpeedLines();
  if (state === 'menu' || state === 'reward') drawTitle();
  drawSlabs();
  drawObstacles();
  drawBestMarker();
  drawCoins();
  drawPlayer();
  drawParticles();
  ctx.restore();

  if (cam > 0.01) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.72);
    g.addColorStop(0, 'rgba(255,40,90,0)'); g.addColorStop(1, 'rgba(255,40,90,' + (0.42 * cam) + ')');
    ctx.fillStyle = g; ctx.fillRect(vx0() - 20, -20, vx1() - vx0() + 40, H + 40);
  }
  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash * 0.55 + ')'; ctx.fillRect(vx0() - 20, -20, vx1() - vx0() + 40, H + 40); }
  if (state === 'play' || state === 'paused' || state === 'dead') drawHUD();
  drawToast();
  if (state === 'play' && best === 0 && playTime < 3.2) {
    ctx.globalAlpha = Math.min(1, (3.2 - playTime) / 0.6) * (0.6 + 0.4 * Math.sin(clock * 7));
    txt('TAP TO FLIP GRAVITY', W / 2, CB + 66, F(20, 900), '#FFFFFF', 'center', rgba('slab', 0.8), 5);
    ctx.globalAlpha = 1;
  }
  if (state === 'menu' || state === 'reward') drawMenuUI();
  else if (state === 'paused') drawPaused();
  else if (state === 'dead') drawGameOver();
  else if (state === 'store') drawStore();
  else if (state === 'goals') drawGoals();
  if (state === 'reward') drawReward();
}

/* ================================================================== input */
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * dpr - offX) / scale, y: ((e.clientY - r.top) * dpr) / scale };
}
function startGame(m) {
  mode = m === 'daily' ? 'daily' : 'normal';
  ensureMissions();
  dailyScored = false;
  if (mode === 'daily' && daily.day !== todayNum()) {      // first daily run of the day is the scored one
    daily = { day: todayNum(), score: 0, tries: 1 }; dailyScored = true; store.set('flip_d', JSON.stringify(daily));
  }
  resetGame(); state = 'play';
  if (up.shield > 0) { up.shield--; shieldOn = true; saveAll(); }
  missionAdd('runs', 1);
  sfx.start(); startMusic();
}
function press(p) {
  initAudio(); resumeAudio();
  if (state === 'store') { storePress(p); return; }
  if (state === 'goals') { goalsPress(p); return; }
  if (state === 'reward') {
    if (performance.now() - rewardAt > 350) { claimStreak(); sfx.buy(); state = 'menu'; }
    return;
  }
  if (state !== 'play' && p) {
    if (inBtn(p, 0)) { sfxOn = !sfxOn; store.set('flip_sfx', sfxOn ? '1' : '0'); if (sfxBus) sfxBus.gain.value = sfxOn ? 0.9 : 0; sfx.tick(); return; }
    if (inBtn(p, 1)) { musOn = !musOn; store.set('flip_mus', musOn ? '1' : '0'); if (musBus) musBus.gain.value = musOn ? MUS_VOL : 0; sfx.tick(); return; }
  }
  if (state === 'menu') {
    if (p) {
      const L = menuL();
      if (inR(p, L.store)) { openStore('menu'); return; }
      if (inR(p, L.goals)) { ensureMissions(); state = 'goals'; sfx.tick(); return; }
      if (inR(p, L.daily)) { startGame('daily'); return; }
    }
    startGame(); return;
  }
  if (state === 'dead') {
    if (performance.now() - deadAt <= 450) return;
    if (p) {
      const L = deadL();
      if (inR(p, L.ad)) { watchAd(); return; }
      if (inR(p, L.store)) { openStore('dead'); return; }
      if (inR(p, L.share)) { shareScore(); return; }
      if (inR(p, L.home)) { goHome(); return; }
    }
    startGame(mode); return;
  }
  if (state === 'paused') {
    if (p) {
      const L = pauseL();
      if (inR(p, L.resume)) { resumeGame(); return; }
      if (inR(p, L.restart)) { startGame(mode); return; }
      if (inR(p, L.home)) { goHome(); return; }
    }

  }

}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(toLogical(e)); }, { passive: false });
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'play') { pauseGame(); return; }
  if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'paused') { resumeGame(); return; }
  if (e.code === 'Escape' && state === 'store') { state = stFrom; return; }
  if (e.code === 'Escape' && state === 'goals') { state = 'menu'; return; }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'KeyW') {
    e.preventDefault(); if (!e.repeat) press(null);
  }
});
function pauseIfPlaying() {
  saveWallet(); saveMissions();
  if (state === 'play') { state = 'paused'; stopMusic(); }
  if (ac && ac.state === 'running') ac.suspend();
}
window.__pause = pauseIfPlaying;
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseIfPlaying(); });
window.addEventListener('blur', pauseIfPlaying);
window.addEventListener('pagehide', saveWallet);

/* ================================================================== loop */
if (streakNext() != null) { state = 'reward'; rewardAt = performance.now(); }   // daily login reward pops up on launch
let last = 0;
function frame(ts) {
  if (!last) last = ts;
  const dt = Math.min((ts - last) / 1000, 1 / 30);
  last = ts;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__ST = {
  pauseBtn, pauseL, update, render, press, startGame, tryFlip, P, obs, coins, revive, watchAd, goHome, openStore, itemsFor, itemState, doAction, gridRects, up, own,
  get state() { return state; }, set state(v) { state = v; },
  get score() { return score; }, get speed() { return speed; }, get best() { return best; },
  get killer() { return lastKiller; }, get zone() { return zoneIdx; }, get playTime() { return playTime; },
  set auto(v) { auto = v; }, setSeed(n) { window.__forceSeed = n; },
  get geom() { return { CT, CB, CH }; },
  drawBotTo,
  get missions() { return missions; }, get streak() { return streak; }, get daily() { return daily; }, get mode() { return mode; },
  get xp() { return xp; }, levelInfo, claimStreak, streakNext, ensureMissions, awardXp, makeShareCanvas, shareScore,
  get bestDist() { return bestDist; }, get closeRun() { return closeRun; }, get xpInfo() { return xpInfo; }, get dist() { return dist; },
  setDay(n) { window.__forceDay = n; ensureMissions(); },

    if (k === 'drop') obs.push({ type: 'block', side: 'f', x: P.x + 260, w: 44, h: 22, hF: 90, drop: true });
  },
  get wallet() { return wallet; }, set wallet(v) { wallet = v; },
  get eq() { return { skin: eqSkin, trail: eqTrail }; },
  setTab(i) { stTab = i; stSel = defaultSel(i); }, select(i) { stSel = i; }, act() { const r = gridRects()[stSel]; if (r) doAction(r.it); },
  trigger(k) {
    if (k === 'magnet') pendingPick = 'magnet';
    if (k === 'magnetnow') { magMax = MAGDUR[up.mag]; magT = magMax; }
    if (k === 'big') { sizeKind = 'big'; szT = BIGS; sizeLeft = SIZE_DUR; }
    if (k === 'small') { sizeKind = 'small'; szT = SMALLS; sizeLeft = SIZE_DUR; }

    if (k === 'shield') shieldOn = true;
